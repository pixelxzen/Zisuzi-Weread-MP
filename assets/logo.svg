<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 104" width="560" height="104" role="img" aria-label="Zisuzi-Weread-MP">
  <title>Zisuzi-Weread-MP</title>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2356"/>
      <stop offset="0.55" stop-color="#171234"/>
      <stop offset="1" stop-color="#0d0a1c"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#9c9cf5"/>
      <stop offset="0.5" stop-color="#5f5fb8"/>
      <stop offset="1" stop-color="#3a3670"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fe3e1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6fe3e1" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#6fe3e1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a7ae0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7a7ae0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="markClip"><rect x="4" y="12" width="80" height="80" rx="22"/></clipPath>
  </defs>

  <style>
    .halo  { animation: halo 4.2s ease-in-out infinite; transform-origin: 44px 52px; }
    .scan  { animation: scan 2.6s cubic-bezier(.32,.72,0,1) infinite; }
    .cardA { animation: cardA 3.4s cubic-bezier(.32,.72,0,1) infinite; }
    .cardB { animation: cardB 3.4s cubic-bezier(.32,.72,0,1) infinite; }
    .facet { animation: facet 4.2s ease-in-out infinite; }
    .rule  { animation: rule 5s cubic-bezier(.32,.72,0,1) infinite; transform-origin: 102px 88px; }
    @keyframes halo   { 0%,100%{opacity:.55;transform:scale(.92)} 50%{opacity:.95;transform:scale(1.06)} }
    @keyframes scan   { 0%{transform:translateY(0);opacity:0} 12%{opacity:1} 82%{opacity:1} 100%{transform:translateY(58px);opacity:0} }
    @keyframes cardA  { 0%{transform:translate(0,0);opacity:0} 18%{opacity:.9} 70%{opacity:.9} 100%{transform:translate(26px,-8px);opacity:0} }
    @keyframes cardB  { 0%{transform:translate(0,0);opacity:0} 22%{opacity:.75} 74%{opacity:.75} 100%{transform:translate(24px,-14px);opacity:0} }
    @keyframes facet  { 0%,100%{opacity:.35} 50%{opacity:.85} }
    @keyframes rule   { 0%{transform:scaleX(.2);opacity:.35} 45%{transform:scaleX(1);opacity:.9} 100%{transform:scaleX(.2);opacity:.35} }
    @media (prefers-reduced-motion: reduce) {
      .halo,.scan,.cardA,.cardB,.facet,.rule { animation: none; }
    }
  </style>

  <!-- mark -->
  <g>
    <rect x="4" y="12" width="80" height="80" rx="22" fill="url(#mark)"/>
    <rect x="4.75" y="12.75" width="78.5" height="78.5" rx="21.25" fill="none" stroke="#8b86d8" stroke-opacity="0.3"/>
    <g clip-path="url(#markClip)">
      <circle class="halo" cx="44" cy="54" r="34" fill="url(#halo)"/>
      <g class="cardA" opacity="0.9">
        <rect x="14" y="44" width="18" height="13" rx="2.5" fill="#d6d3f5" fill-opacity="0.85"/>
        <rect x="16.5" y="47.5" width="13" height="1.6" rx="0.8" fill="#474980"/>
        <rect x="16.5" y="51" width="9" height="1.6" rx="0.8" fill="#474980" fill-opacity="0.6"/>
      </g>
      <g class="cardB" opacity="0.75">
        <rect x="12" y="62" width="15" height="11" rx="2" fill="#d6d3f5" fill-opacity="0.6"/>
        <rect x="14" y="65" width="11" height="1.4" rx="0.7" fill="#474980" fill-opacity="0.8"/>
      </g>
      <g>
        <path d="M52 30 L70 44 L62 70 L40 70 L34 44 Z" fill="url(#crystal)" fill-opacity="0.92"/>
        <path class="facet" d="M52 30 L52 70 M52 30 L34 44 M52 30 L70 44" stroke="#c9c6ff" stroke-opacity="0.55" stroke-width="1.1" fill="none"/>
        <path d="M44 52 L48 48 L52 52 L48 56 Z" fill="#a9f3f1"/>
      </g>
      <g class="scan">
        <rect x="10" y="24" width="68" height="10" fill="url(#beam)" opacity="0.28"/>
        <rect x="10" y="28" width="68" height="1.4" fill="#9ff2ef" opacity="0.85"/>
      </g>
    </g>
  </g>

  <!-- wordmark: mid-violet reads on both light and dark backgrounds -->
  <g font-family="PingFang SC, Hiragino Sans GB, -apple-system, 'Segoe UI', sans-serif">
    <text x="102" y="52" font-size="27" font-weight="600" fill="#5b5bb0" letter-spacing="0.3">Zisuzi<tspan fill="#8f8fc8" font-weight="400">-Weread-MP</tspan></text>
    <text x="102" y="76" font-size="12.5" fill="#8d8db4" letter-spacing="0.5">微信读书公众号盯采 · WeRead → Markdown</text>
    <rect class="rule" x="102" y="86" width="150" height="1.6" rx="0.8" fill="#6fe3e1" opacity="0.85"/>
  </g>
</svg>
