name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build

      # 官方 Build verification 的要求：从该 tag 的源码重建，必须与仓库根产物逐字节一致
      - name: Verify committed artifacts match a clean build
        run: git diff --exit-code -- main.js styles.css manifest.json

      - run: npm test

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 幂等：tag 重推或重跑时，先建/复用 draft，再强制覆盖资产（避免 HTTP 422 ReleaseAsset.name already exists）
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" main.js manifest.json styles.css --clobber
